<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="看见她 Unseen：当一天医生，学会认出 PCOS 的信号。Spend a day as a doctor and learn the signs of PCOS.">
<script defer src="https://cloud.umami.is/script.js" data-website-id="2ab0e66d-dc83-402f-9936-2f6b55c11c88"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>看见她 Unseen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Silkscreen&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a clinic terminal survival game. Title = menu left, pixel ovary mascot right.
   Game = order sheet | patient chart (lab-report rows) | queue + verdict. Own light/dark skin setting. */
:root{
  --bg:#F1EEF0; --panel:#FBFAFA; --panel2:#F4F0F2; --line:#D6CDD3; --ink:#231B21; --muted:#7B7078;
  --accent:#C23F6E; --accent-dim:#F7DCE6; --accent-ink:#FFFFFF;
  --flag:#BF4A12; --flag-bg:rgba(191,74,18,.10); --ok:#1E7A62; --ok-bg:rgba(30,122,98,.10);
  --speech-bg:#231B21; --speech-ink:#F4EEF1; --speech-tag:#E8A0BC; --field:.10;
  --f-pixel:"ZCOOL QingKe HuangYou","Silkscreen","Noto Sans SC",sans-serif;
  --f-tag:"Silkscreen","IBM Plex Mono",monospace;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-skin="dark"]{
  --bg:#0E0C11; --panel:#17141C; --panel2:#1F1A26; --line:#302A3B; --ink:#EDE7F3; --muted:#8F869C;
  --accent:#E8729F; --accent-dim:#4A2234; --accent-ink:#1A0E14;
  --flag:#FF8C4F; --flag-bg:rgba(255,140,79,.12); --ok:#6CD3B4; --ok-bg:rgba(108,211,180,.12);
  --speech-bg:#EDE5D8; --speech-ink:#241C1F; --speech-tag:#7A6B60; --field:.08;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.tag{font-family:var(--f-tag);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1,h2,h3{margin:0;text-wrap:balance}

/* drifting lab values in the background */
.field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.field pre{position:absolute;top:0;left:0;margin:0;font-family:var(--f-mono);font-size:11px;line-height:1.7;color:var(--muted);opacity:var(--field);white-space:pre;animation:drift 120s linear infinite}
.field pre:nth-child(2){left:auto;right:0;animation-duration:160s;opacity:.06}
.field pre i{font-style:normal;color:var(--accent);opacity:1}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-50%)}}

/* ---------- title screen ---------- */
.title{min-height:100vh;display:flex;flex-direction:column;padding-block:20px 18px}
.title .top{display:flex;align-items:center;gap:10px}
.title .top .sp{flex:1}
.gear{border:0;background:none;color:var(--accent);font-size:22px;line-height:1;padding:4px}
.title .mid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:40px}
.big{font-family:var(--f-pixel);font-weight:400;font-size:clamp(56px,10vw,104px);line-height:1;letter-spacing:.04em}
.big small{display:block;font-family:var(--f-tag);font-size:clamp(14px,2vw,20px);letter-spacing:.5em;color:var(--accent);margin-top:14px}
.menu{list-style:none;margin:36px 0 0;padding:0;display:grid;gap:4px;max-width:360px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:8px 12px;font-size:18px;border-radius:2px}
.menu button::before{content:"";width:0;height:0;border-left:9px solid var(--muted);border-top:6px solid transparent;border-bottom:6px solid transparent}
.menu button:hover:not(:disabled),.menu button:focus-visible{border-color:var(--accent);background:var(--accent-dim)}
.menu button:hover:not(:disabled)::before{border-left-color:var(--accent)}
.menu button:disabled{opacity:.35;cursor:not-allowed}
.menu .sub{font-size:12px;color:var(--muted);margin-left:auto;font-family:var(--f-mono)}
.mascot{display:grid;place-items:center}
.mascot canvas{width:min(100%,360px);height:auto;image-rendering:pixelated}
.title .bottom{font-size:12px;color:var(--muted);display:grid;gap:2px}
.title .bottom b{color:var(--ink);font-weight:500;font-family:var(--f-mono)}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;z-index:20;background:rgba(5,4,7,.72);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(760px,100%);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--accent);border-radius:2px;padding:22px 24px}
.modal h2{font-family:var(--f-pixel);font-size:30px;font-weight:400;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel2);padding:5px 14px;font-size:13px;border-radius:2px}
.tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.modal p{margin:0 0 12px}
.modal .lead{font-size:17px}
.modal h3{font-size:14px;margin:18px 0 8px;color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px}
.tbl td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
.tbl td.n{font-family:var(--f-mono);white-space:nowrap}
.tbl .plus{color:var(--ok)} .tbl .minus{color:var(--flag)}
.scroll{overflow-x:auto}
.modal .close{display:flex;justify-content:flex-end;margin-top:18px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:2px;padding:9px 20px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- game bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:9px}
.logo{font-family:var(--f-pixel);font-size:20px;display:flex;align-items:baseline;gap:8px}
.bar .sp{flex:1}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .val{font-family:var(--f-mono);font-size:17px;color:var(--accent)}
.meter{width:110px;height:4px;background:var(--line);margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.linkbtn{border:1px solid var(--line);background:none;padding:5px 12px;font-size:13px;border-radius:2px}

/* ---------- stage intro ---------- */
.stage-intro{padding-block:56px;max-width:720px}
.stage-intro h2{font-family:var(--f-pixel);font-weight:400;font-size:clamp(34px,5vw,52px);margin:10px 0 18px;line-height:1.1}
.stage-intro p{font-size:17px;margin:0 0 14px}
.crit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0 28px}
.crit div{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:2px}
.crit b{display:block;font-family:var(--f-tag);font-size:11px;color:var(--accent);margin-bottom:6px}

/* ---------- play ---------- */
.play{display:grid;grid-template-columns:270px minmax(0,1fr) 280px;gap:16px;padding-block:18px 32px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;position:relative}
.panel>h3{padding:12px 14px 4px}
.shop .grp{padding:2px 8px 8px}
.shop .gname{font-size:12px;font-weight:700;padding:8px 6px 4px;color:var(--accent)}
.clue{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:1px solid transparent;background:none;border-radius:2px;padding:6px 8px;text-align:left;font-size:14px}
.clue:hover:not(:disabled){border-color:var(--accent);background:var(--accent-dim)}
.clue .c{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.clue.done{color:var(--muted)} .clue.done .c{color:var(--ok)}
.clue:disabled{cursor:not-allowed}
.clue .askq{color:var(--accent)}

.chart{padding:20px 22px 24px;min-width:0}
.who{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ava{width:50px;height:50px;display:grid;place-items:center;font-family:var(--f-pixel);font-size:24px;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);flex:none;border-radius:2px}
.who h2{font-size:22px;font-weight:700}
.who .meta{font-size:13px;color:var(--muted)}
.stamp{font-family:var(--f-mono);font-size:11px;border:1.5px solid var(--flag);color:var(--flag);padding:2px 7px;transform:rotate(-3deg);display:inline-block}
.speech{margin:16px 0 6px;background:var(--speech-bg);color:var(--speech-ink);border-radius:2px;padding:12px 16px;font-size:16px}
.speech small{display:block;font-size:11px;color:var(--speech-tag);margin-bottom:3px;font-weight:700}
.file{margin-top:12px;border:1px dashed var(--line);padding:10px 14px;font-size:14px}
.report{margin-top:18px}
.report .head,.row{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 2.2em;gap:12px}
.report .head{border-bottom:1px solid var(--accent);padding:0 4px 6px}
.row{padding:9px 4px;border-bottom:1px solid var(--line);align-items:baseline;animation:in .35s ease}
.row .k{font-size:13px;color:var(--muted)}
.row .v{min-width:0}
.row .h{font-family:var(--f-mono);font-size:12px;font-weight:500;text-align:right}
.row.abn{background:linear-gradient(90deg,var(--flag-bg),transparent 85%)}
.row.abn .h{color:var(--flag)}
.empty{padding:20px 4px;color:var(--muted);font-size:14px}
@keyframes in{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.notes{margin-top:20px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);padding:5px 12px;font-size:13px;border-radius:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chip.auto{cursor:default}
.chip.auto.on{border-color:var(--ok);color:var(--ok)}

.side{display:grid;gap:16px}
.q{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 14px;border-top:1px solid var(--line)}
.q .ava{width:34px;height:34px;font-size:17px}
.q .n{flex:1;min-width:0;font-size:14px}
.q .s{font-size:11px;font-family:var(--f-mono);color:var(--muted);border:1px solid var(--line);padding:1px 6px}
.q[aria-current="true"]{background:var(--accent-dim)}
.q.judged .s{color:var(--ok);border-color:var(--ok)}
.verdict{padding:6px 14px 16px;display:grid;gap:8px}
.vopt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel2);border-radius:2px;padding:10px 12px;text-align:left;font-weight:500}
.vopt[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.vopt .box{width:14px;height:14px;border:1.5px solid var(--muted);flex:none}
.vopt.single .box{border-radius:50%}
.vopt[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent)}
.judged-msg{padding:6px 14px 16px;color:var(--muted);font-size:14px}
.next{padding:12px 14px}

/* ---------- settlement / end ---------- */
.settle{padding-block:36px 40px;max-width:880px}
.settle h2{font-family:var(--f-pixel);font-weight:400;font-size:clamp(30px,4.5vw,44px);margin:8px 0 6px}
.ledger{margin:22px 0;background:var(--panel);border:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;padding:14px 18px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.pts{font-family:var(--f-mono);font-size:18px}
.pts.plus{color:var(--ok)} .pts.minus{color:var(--flag)}
.sub{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--flag);margin-top:2px} .note.good{color:var(--ok)}
details.card{grid-column:1/-1;border:1px solid var(--line);background:var(--panel2)}
details.card summary{cursor:pointer;padding:9px 14px;font-weight:700;font-size:14px;color:var(--accent)}
details.card dl{margin:0;padding:0 14px 14px;display:grid;grid-template-columns:minmax(0,7em) minmax(0,1fr);gap:8px 14px;font-size:14px}
details.card dt{color:var(--muted);font-size:12px;padding-top:2px}
details.card dd{margin:0}
.total{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.family{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}
.fam{background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;gap:8px;align-content:start}
.fam .yr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.fam h3{font-size:17px}
.badge{justify-self:start;font-size:12px;padding:1px 9px;border:1px solid}
.badge.ok{color:var(--ok)} .badge.no{color:var(--flag)}
.thread{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.thread i{flex:1;min-width:20px;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 10px)}
blockquote{margin:20px 0;padding:14px 18px;border-left:3px solid var(--accent);background:var(--panel);font-size:17px}
.foot{position:relative;z-index:1;font-size:12px;color:var(--muted);padding-block:20px 32px}

/* ---------- tutorial ---------- */
.spot{position:relative;z-index:30;box-shadow:0 0 0 2px var(--accent),0 0 0 100vmax rgba(5,4,7,.7)}
.blocker{position:fixed;inset:0;z-index:35}
.coach{position:fixed;z-index:40;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--accent);padding:14px 16px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 14px}
.coach canvas{width:64px;height:64px;image-rendering:pixelated;grid-row:span 3;background:var(--accent-dim)}
.coach .nm{display:flex;justify-content:space-between;font-family:var(--f-tag);font-size:11px;color:var(--accent)}
.coach .ttl{font-weight:700;color:var(--accent)}
.coach p{grid-column:1/-1;margin:6px 0 0;font-size:14px}
.coach .acts{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.coach .skip{border:0;background:none;color:var(--muted);font-size:13px}

@media (prefers-reduced-motion:reduce){.field pre,.row{animation:none}.meter i{transition:none}}
@media (max-width:980px){
  .play{grid-template-columns:minmax(0,1fr)}
  .play .chart{order:1} .play .shop{order:2} .play .side{order:3}
  .title .mid{grid-template-columns:minmax(0,1fr)}
  .mascot{order:-1} .mascot canvas{width:min(60%,220px)}
  .family{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .crit{grid-template-columns:minmax(0,1fr)}
  .report .head,.row{grid-template-columns:minmax(0,6.5em) minmax(0,1fr) 2em;gap:8px}
  .chart{padding:16px 14px}
  .meter{width:70px}
  details.card dl{grid-template-columns:minmax(0,1fr)}
  .modal{padding:18px 16px}
}

/* ---------- difficulty select ---------- */
.diffpage{padding-block:28px 24px}
.diffpage h2{font-family:var(--f-pixel);font-weight:400;font-size:clamp(30px,4.5vw,42px)}
.diffgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0 16px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:420px}
.dcard[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dcard .dn{font-family:var(--f-pixel);font-size:32px;color:var(--accent);line-height:1.1}
.dcard .dl{font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px}
.dcard p{margin:0;font-size:14px}
.dcard dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.dcard dt{color:var(--muted)} .dcard dd{margin:0;font-family:var(--f-mono)}
.dcard .sp{flex:1}
.dcard .pick{border:1px solid var(--line);background:var(--panel2);padding:8px;border-radius:2px;font-weight:500}
.dcard[aria-selected="true"] .pick{border-color:var(--accent);color:var(--accent)}
.diffbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.diffbar .rules{font-size:12px;color:var(--muted);max-width:52em}
.bulletin{display:inline-block;margin-top:6px;font-size:14px;border-left:3px solid var(--accent);padding:4px 10px;background:var(--panel)}
.vgrid{display:grid;gap:6px}
.vopt.small{padding:7px 10px;font-size:14px}
@media (max-width:980px){.diffgrid{grid-template-columns:minmax(0,1fr)}.dcard{min-height:0}}

/* ---------- survival UI ---------- */
.pips{display:inline-flex;gap:4px;margin-top:5px}
.pip{width:11px;height:11px;border:1.5px solid var(--muted);border-radius:2px;display:inline-block}
.pip.on{background:var(--flag);border-color:var(--flag)}
.daystats{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 22px}
.daystats>div{background:var(--panel);border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:120px;border-radius:2px}
.daystats b{font-family:var(--f-mono);font-size:20px;font-weight:500;color:var(--accent)}
.panel.money{padding:16px 18px}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.tbl td.n.plus{color:var(--ok)} .tbl td.n.minus{color:var(--flag)}
.bigline{font-size:20px;margin:14px 0 6px}
.signcard{margin-top:26px;background:var(--panel);border:2px solid var(--accent);padding:22px 24px;border-radius:2px}
.signcard h2{font-family:var(--f-pixel);font-weight:400;font-size:clamp(28px,4vw,38px);margin-bottom:8px}
.signcard h3{margin:20px 0 10px;font-size:15px}
.signs{margin:12px 0;padding-left:1.4em;display:grid;gap:6px;font-size:16px}
.signcard .action{font-weight:700;font-size:17px;background:var(--accent-dim);padding:10px 14px;margin:14px 0 0;border-radius:2px}
.chip.strike{text-decoration:line-through;text-decoration-color:var(--flag);cursor:default}
.sharebox{margin-top:22px;border:1px dashed var(--line);padding:16px 18px;border-radius:2px}
.sharebox h3{font-size:15px;margin-bottom:8px}
.sharetext{font-size:14px;background:var(--panel2);padding:10px 12px;margin:0 0 12px;user-select:all;overflow-wrap:anywhere}
.steps{padding-left:1.3em;display:grid;gap:8px;margin:0 0 14px}
.famblock{margin-top:32px}
.row .h{color:var(--flag);font-weight:700}
</style>
</head>
<body>
<div class="field" aria-hidden="true"><pre id="f1"></pre><pre id="f2"></pre></div>
<div id="app"></div>

<script>
(function(){
const L = o => (o && typeof o==='object') ? (o[S.lang] ?? o.zh) : o;
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function poolIds(){return CASES.filter(c=>c.d===S.diff&&!c.fam).map(c=>c.id)}
function drawDay(){
  if(D().family&&!S.famDone&&S.day+1===S.famDay){S.famDone=true;return['f1','f2','f3']}
  const out=[];
  while(out.length<3){
    if(!S.queue.length){const recent=new Set(S.used.slice(-3));S.queue=shuffle(poolIds()).sort((a,b)=>recent.has(a)-recent.has(b))}
    const id=S.queue.shift(); if(!out.includes(id)) out.push(id);
  }
  S.used.push(...out); return out;
}
function startDay(){
  S.day++; S.todayIds=drawDay(); S.rev={}; S.order={}; S.notes={}; S.pick={}; S.verdicts={}; S.bulletin=S.todayIds[0]==='f1'?FAMILY_BULLETIN:BULLETIN[Math.floor(Math.random()*BULLETIN.length)];

function drawOvary(cv,scale,phase){
  const W=26,Hh=20;cv.width=W*scale;cv.height=Hh*scale;const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
  const P=S.skin==='dark'?{body:'#E8729F',rim:'#C4567F',fol:'#5A2238',lit:'#FFE3EE',eye:'#1A0E14'}:{body:'#E7759F',rim:'#B8406B',fol:'#6E2140',lit:'#FFFFFF',eye:'#231B21'};
  const cx=12.5,cy=9,rx=11,ry=8,px=(i,j,c)=>{x.fillStyle=c;x.fillRect(i*scale,j*scale,scale,scale)};
  for(let j=0;j<Hh;j++)for(let i=0;i<W;i++){const d=((i-cx)/rx)**2+((j-cy)/ry)**2;if(d<=1)px(i,j,d>0.82?P.rim:P.body)}
  for(let k=0;k<11;k++){const a=k/11*Math.PI*2+0.2,fx=Math.round(cx+Math.cos(a)*rx*0.72),fy=Math.round(cy+Math.sin(a)*ry*0.66),lit=((k+phase)%4)===0;px(fx,fy,lit?P.lit:P.fol);px(fx+1,fy,lit?P.lit:P.fol)}
  [[9,8],[10,8],[9,9],[10,9],[15,8],[16,8],[15,9],[16,9]].forEach(([i,j])=>px(i,j,P.eye));
  [[7,17],[7,18],[11,17],[11,18],[14,17],[14,18],[18,17],[18,18]].forEach(([i,j])=>px(i,j,P.rim));
}
function drawCoach(cv){
  const s=4,G=['................','.....######.....','....########....','...##########...','...#ssssssss#...','...sweswwswes...','...ssssssssss...','....sssmmsss....','.....ssssss.....','...wwwwwwwwww...','..wwwwwkkwwwww..','..wwwwwkkwwwww..','..wwwwkwwkwwww..','..wwwwwwwwwwww..','..wwwwwwwwwwww..','................'];
  const col={'#':'#2B2230',s:'#E9C2A6',e:'#1A0E14',w:'#EDE7F3',m:'#B0546F',k:'#4B8F9C'};
  cv.width=64;cv.height=64;const x=cv.getContext('2d');G.forEach((r,j)=>[...r].forEach((ch,i)=>{if(col[ch]){x.fillStyle=col[ch];x.fillRect(i*s,j*s,s,s)}}));
}

function judge(c,choice){
  const r={pay:0,fine:0,complaint:0,result:'wrong',notes:[]};
  if(choice===c.ans){r.result='right';r.pay=PAY;if(choice==='pcos'&&!revOf(c.id).includes('preg')){r.pay=PAY/2;r.notes.push('preg')}}
  else if(c.part&&choice===c.part){r.result='part';r.pay=PART_PAY}
  else{
    r.fine=c.red?RED_FINE:FINE;
    if(c.red||(c.ans==='pcos'&&choice!=='pcos')||(choice==='fine'&&c.ans!=='fine')) r.complaint=1;
  }
  return r;
}

    <div class="tag" style="color:var(--accent)">${esc(L(D().name))}</div>
    <h2>${esc(fill(L(T.nightTitle),{n:S.day}))}</h2>
    <div class="ledger">${rows}</div>
    <div class="panel money"><h3 class="tag" style="padding:0 0 8px">${esc(L(T.ledger))}</h3>
      <table class="tbl"><tbody>
        <tr><td>${esc(L(T.start))}</td><td class="n">RM ${g.start}</td></tr>
        <tr><td>${esc(L(T.pay))}</td><td class="n plus">+RM ${g.pay}</td></tr>
        <tr><td>${esc(L(T.fines))}</td><td class="n minus">−RM ${g.fines}</td></tr>
        <tr><td>${esc(L(T.rentPaid))}</td><td class="n minus">−RM ${g.rent}</td></tr>
        <tr class="tot"><td>${esc(L(T.endMoney))}</td><td class="n ${S.money<0?'minus':''}">RM ${S.money}</td></tr>
        <tr><td>${esc(L(T.complaints))}</td><td class="n"><span class="pips">${pips(S.complaints)}</span></td></tr>
      </tbody></table></div>
    <div class="total" style="margin-top:18px"><span></span>
      <button class="btn" data-act="${over?'end':'next'}">${over?esc(L(T.seeEnd)):esc(fill(L(T.nextDay),{n:S.day+1}))}</button></div>
  </section></main>`+foot();
}

const FAM={
  grandma:{rel:t('外婆','Grandma'),yr:'1952',ok:t('她被送去检查心脏，发现血管堵了，及时放了支架。','She was sent for a heart check; a blocked artery was found and stented in time.'),no:t('两个月后，她以为是胃不舒服，其实是心脏病发作，送医太晚。','Two months later she thought it was indigestion. It was a heart attack, and she reached hospital too late.')},
  mother:{rel:t('妈妈','Mum'),yr:'1978',ok:t('查出糖尿病和 PCOS，一起治疗后，血糖稳定下来。','Diabetes and PCOS were found and treated together; her blood sugar settled.'),no:t('口渴、夜尿都被当成更年期。两年后，糖尿病伤到了肾。','Thirst and night-time trips were called menopause. Two years later diabetes had damaged her kidneys.')},
  daughter:{rel:t('女儿','Daughter'),yr:'2006',ok:t('20 岁就确诊。后来怀孕时提早查了血糖，宝宝健康出生。','Diagnosed at 20. When she was pregnant she was checked early, and her baby was born healthy.'),no:t('被告诉“没事”。后来备孕两年都没成功，才找到原因。','Told she was fine. Two years of trying for a baby passed before anyone found out why.')}
};
function vEnd(){
  const b=bests(),k=D().k,days=S.day;
  if(days>(b[k]||0)){b[k]=days;store.set(BEST,b)}
  const why=S.endReason==='fired'?[T.fired,T.firedBody]:[T.evicted,T.evictedBody];
  const st=S.stats;
  const shareMsg=fill(L(T.shareText),{d:days})+' '+GAME_URL;
  let fam='';
  if(['f1','f2','f3'].every(id=>S.famResults[id])){
    fam=`<section class="famblock"><div class="tag" style="color:var(--accent)">${esc(L(T.famUnlock))}</div><h2>${esc(L(T.famTitle))}</h2><p style="max-width:42em">${esc(L(T.famBody))}</p>
      <div class="thread"><span>${esc(L(FAM.grandma.rel))}</span><i></i><span>${esc(L(FAM.mother.rel))}</span><i></i><span>${esc(L(FAM.daughter.rel))}</span></div>
      <div class="family">${['f1','f2','f3'].map(id=>{const c=CASE[id],f=FAM[c.fam],ok=S.famResults[id]!=='wrong';
        return `<div class="fam"><span class="yr">${f.yr}</span><h3>${esc(L(f.rel))} · ${esc(L(c.name))}</h3><span class="badge ${ok?'ok':'no'}">${esc(L(ok?T.seen:T.unseen))}</span><p style="margin:0">${esc(L(ok?f.ok:f.no))}</p></div>`}).join('')}</div>
      <blockquote>${esc(L(T.ifquote))}</blockquote></section>`;
  }
  app.innerHTML=`<main class="wrap"><section class="settle" style="max-width:920px">
    <div class="tag" style="color:var(--accent)">${esc(L(D().name))} · GAME OVER</div>
    <h2>${esc(L(why[0]))}</h2><p class="muted">${esc(L(why[1]))}</p>
    <p class="bigline">${esc(fill(L(T.survived),{d:days,p:st.seen}))}</p>
    <div class="daystats"><div><span class="tag">${esc(L(T.right))}</span><b>${st.right}</b></div><div><span class="tag">${esc(L(T.caught))}</span><b>${st.caught}</b></div><div><span class="tag">${esc(L(T.missed))}</span><b>${st.missed}</b></div></div>
    <section class="signcard">
      <h2>${esc(L(T.signsTitle))}</h2><p>${esc(L(T.signsLead))}</p>
      <ol class="signs">${T.signList.map(s=>`<li>${esc(L(s))}</li>`).join('')}</ol>
      <p class="action">${esc(L(T.signsAction))}</p>
      <h3>${esc(L(T.dontSay))}</h3>
      <div class="chips">${T.dontList.map(s=>`<span class="chip strike">${esc(L(s))}</span>`).join('')}</div>
      <p class="muted" style="font-size:13px;margin-top:10px">${esc(L(T.painNote))}</p>
    </section>
    <section class="sharebox"><h3>${esc(L(T.share))}</h3><p class="sharetext" id="sharetext">${esc(shareMsg)}</p>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" data-act="copy">${esc(L(T.copy))}</button>${S.copyMsg?`<span class="muted">${esc(L(T[S.copyMsg]))}</span>`:''}</div></section>
    ${fam}
    <div style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap"><button class="btn" data-act="new">${esc(L(T.again))}</button><button class="btn ghost" data-act="home">${esc(L(T.home))}</button></div>
  </section></main>`+foot();
}

function vModal(){
  if(!S.modal) return '';
  if(S.modal==='manual'){const m=MANUAL[S.mtab]||MANUAL.play;
    return `<div class="veil" data-veil="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(L(T.manual))}"><h2>${esc(L(T.manual))}</h2>
      <div class="tabs">${Object.entries(MANUAL).map(([k,v])=>`<button data-mtab="${k}" aria-pressed="${k===S.mtab}">${esc(L(v.tab))}</button>`).join('')}</div>
      ${m.html()}<div class="close"><button class="btn ghost" data-close="1">${esc(L(T.close))}</button></div></div></div>`}
  return `<div class="veil" data-veil="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(L(T.settings))}" style="width:min(440px,100%)"><h2>${esc(L(T.settings))}</h2>
    <p class="tag">${esc(L(T.lang))}</p><div class="seg" style="margin:8px 0 22px"><button data-lang="zh" aria-pressed="${S.lang==='zh'}">中文</button><button data-lang="en" aria-pressed="${S.lang==='en'}">English</button></div>
    <p class="tag">${esc(L(t('配色','Colours')))}</p><div class="seg" style="margin:8px 0 22px"><button data-skin="light" aria-pressed="${S.skin==='light'}">${esc(L(t('浅色','Light')))}</button><button data-skin="dark" aria-pressed="${S.skin==='dark'}">${esc(L(t('深色','Dark')))}</button></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${S.msg==='confirmClear'?`<button class="btn" data-act="clearYes">${esc(L(T.clearConfirm))}</button>`:`<button class="btn ghost" data-act="clear" ${saved()?'':'disabled'}>${esc(L(T.clear))}</button>`}${S.msg==='cleared'?`<span class="muted">${esc(L(T.cleared))}</span>`:''}</div>
    <div class="close"><button class="btn ghost" data-close="1">${esc(L(T.close))}</button></div></div></div>`;
}
function vCoach(){
  if(S.tut==null||S.screen!=='play') return '';
  const st=TUT[S.tut];
  return `<div class="blocker"></div><div class="coach" role="dialog" aria-label="${esc(L(COACH.name))}"><canvas id="coachpx" width="64" height="64" aria-hidden="true"></canvas>
    <div class="nm"><span>${esc(L(COACH.name))}</span><span>${S.tut+1} / ${TUT.length}</span></div><div class="tag">${esc(L(COACH.role))}</div><div class="ttl">${esc(L(st.h))}</div><p>${esc(L(st.p))}</p>
    <div class="acts"><button class="btn" data-act="tutNext">${esc(L(S.tut===TUT.length-1?t('开始看诊','Start'):t('明白','Got it')))}</button><button class="skip" data-act="tutSkip">${esc(L(t('跳过','Skip')))}</button></div></div>`;
}

const app=document.getElementById('app');
function render(){
  document.documentElement.dataset.skin=S.skin;
  ({title:vTitle,diff:vDiff,day:vDay,play:vPlay,night:vNight,end:vEnd})[S.screen]();
  app.insertAdjacentHTML('beforeend',vModal()+vCoach());
  if(S.tut!=null&&S.screen==='play'){const cv=document.getElementById('coachpx');if(cv)drawCoach(cv);const sel=TUT[S.tut].sel,el=sel&&document.querySelector(sel);if(el){el.classList.add('spot');el.scrollIntoView({block:'center',behavior:'smooth'})}}
  document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';
  persist();
}
const top=()=>window.scrollTo({top:0});

function closeDay(){
  const list=today(),start=S.money;let pay=0,fines=0;
  list.forEach(c=>{const v=S.verdicts[c.id];pay+=v.pay;fines+=v.fine;S.complaints+=v.complaint;S.stats.seen++;
    if(v.result==='right')S.stats.right++;
    if(hasPcos(c)&&c.ans==='pcos'){if(v.choice==='pcos')S.stats.caught++;else S.stats.missed++}
    const mins=revOf(c.id).reduce((m,k)=>m+(k.startsWith('ask')?1:CLUE[k].c),0);
    track('case_result',{difficulty:D().k,case_id:c.id,result:v.result,advice:v.choice,minutes_used:mins,checks_used:revOf(c.id).length,red_flag:c.red?1:0,family:c.fam||'none'});
  });
  if(list.some(c=>c.fam)) list.forEach(c=>{S.famResults[c.id]=S.verdicts[c.id].result});
  const rent=rentFor(S.day);S.money=start+pay-fines-rent;
  S.dayLog={start,pay,fines,rent};
  S.endReason=S.complaints>=MAX_COMPLAINTS?'fired':(S.money<0?'evicted':null);
  track('day_complete',{difficulty:D().k,day:S.day,pay,fines,rent,money:S.money,complaints:S.complaints,right:list.filter(c=>S.verdicts[c.id].result==='right').length});
  if(S.endReason) track('game_over',{difficulty:D().k,reason:S.endReason,days:S.day,seen:S.stats.seen,right:S.stats.right,pcos_caught:S.stats.caught,pcos_missed:S.stats.missed,family:S.famDone?'met':'none'});
}

app.addEventListener('click',e=>{
  if(e.target.dataset&&e.target.dataset.veil){S.modal=null;S.msg=null;render();return}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.lang){S.lang=d.lang;savePrefs();track('setting_language',{lang:S.lang});render();return}
  if(d.skin){S.skin=d.skin;savePrefs();track('setting_skin',{skin:S.skin});render();return}
  if(d.modal){S.modal=d.modal;S.msg=null;track('open_'+d.modal,{screen:S.screen});render();return}
  if(d.mtab){S.mtab=d.mtab;render();return}
  if(d.close){S.modal=null;S.msg=null;render();return}
  if(d.diff){S.diff=+d.diff;render();return}
  if(d.pt){S.cur=d.pt;render();top();return}
  if(d.clue){const c=CASE[S.cur],k=d.clue,cost=k.startsWith('ask')?1:CLUE[k].c;if(S.time<cost||revOf(c.id).includes(k))return;S.time-=cost;revOf(c.id).push(k);(S.order[c.id] ||= []).push(k);render();return}
  if(d.note){const a=(S.notes[S.cur] ||= [0,0,0]);a[+d.note]^=1;render();return}
  if(d.v){S.pick[S.cur]=d.v;render();return}
  switch(d.act){
    case 'new':{const l=S.lang,sk=S.skin,df=S.diff;S=fresh(l,sk);S.diff=df;S.screen='diff';render();top();break}
    case 'go':newRun(S.diff);track('game_start',{difficulty:D().k});render();top();break;
    case 'continue':{const sv=saved();if(sv){S={...fresh(S.lang,S.skin),...sv,lang:S.lang,skin:S.skin};track('game_continue',{difficulty:D().k,day:S.day});render();top()}break}
    case 'tutorial':newRun(0);S.screen='play';S.tut=0;track('tutorial_start');render();top();break;
    case 'tutNext':S.tut=S.tut<TUT.length-1?S.tut+1:null;render();if(S.tut==null)top();break;
    case 'tutSkip':track('tutorial_skip',{step:S.tut+1});S.tut=null;render();top();break;
    case 'home':S=fresh(S.lang,S.skin);render();top();break;
    case 'begin':S.screen='play';S.cur=null;render();top();break;
    case 'confirm':{const c=CASE[S.cur],ch=S.pick[c.id];if(!ch)return;S.verdicts[c.id]={choice:ch,...judge(c,ch)};render();break}
    case 'settle':closeDay();S.screen='night';render();top();break;
    case 'next':startDay();render();top();break;
    case 'end':S.screen='end';render();top();break;
    case 'copy':{const txt=document.getElementById('sharetext').textContent;
      const ok=()=>{S.copyMsg='copied';track('share_copy',{days:S.day});render()},bad=()=>{S.copyMsg='copyFail';render();const el=document.getElementById('sharetext');if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}};
      try{navigator.clipboard.writeText(txt).then(ok,bad)}catch(_){bad()}break}
    case 'clear':S.msg='confirmClear';render();break;
    case 'clearYes':store.del(SAVE);S.msg='cleared';render();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;S.msg=null;render()}});

(function(){const tok=['LH 9.4','FSH 4.1','TSH 2.3','PRL 18','AMH 6.8','HbA1c 5.9','T 2.6','SHBG 24','E2 180','17-OHP 1.1','OGTT 8.4','BMI 21','hCG <5','FPG 5.8','BP 128/82','DHEAS 6.2'];
  const mk=()=>{let s='';for(let i=0;i<180;i++){s+=tok[(i*7+3)%tok.length].padEnd(12)+(i%3===2?'\n':'')}return s+s};
  document.getElementById('f1').textContent=mk();document.getElementById('f2').textContent=mk().split('\n').slice(7).join('\n')})();

const startApp=()=>render();
hot&&hot.ready?hot.ready(startApp):startApp();
})();

</script>
